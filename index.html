<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Left-Right Animation</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: 100px;
      height: 100px;
      background-color: cornflowerblue;
      position: relative;
      animation: moveResize 3s ease-in-out infinite alternate;
    }

    @keyframes moveResize {
      0% {
        left: 0;
        transform: scale(0.8); 
     
      }
      100% {
        left: 200px;
        transform: scale(1.3);

      }
    }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
